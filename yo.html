<head>

<title>Hues & Cues Prompt Game</title>
<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container{
  width:90%;
  max-width:850px;
  text-align:center;
  background:#1b1b1b;
  padding:30px;
  border-radius:20px;
}
h1{font-size:2.4rem}
.prompt{
  font-size:2.4rem;
  margin:35px 0;
  min-height:90px;
}
button{
  background:white;
  color:black;
  border:none;
  padding:15px 24px;
  margin:8px;
  border-radius:12px;
  cursor:pointer;
  font-size:1rem;
}
.answerBox{display:none;margin-top:30px}
.colorPreview{
  width:220px;
  height:220px;
  border:5px solid white;
  border-radius:16px;
  margin:20px auto;
}
.code{
  font-size:3.2rem;
  font-weight:bold;
}
.hex{opacity:.8}
.counter{opacity:.55;margin-top:18px}
</style>
</head>
<body>
<div class="container">
  <h1>🎨 Hues & Cues Chaos</h1>
  <div class="prompt" id="prompt">Press Generate</div>
  <button onclick="generatePrompt()">Generate Prompt</button>
  <button onclick="showAnswer()">Show Answer</button>
  <div class="answerBox" id="answerBox">
    <div class="colorPreview" id="colorPreview"></div>
    <div class="code" id="boardCode"></div>
    <div class="hex" id="hexCode"></div>
  </div>
  <div class="counter" id="counter"></div>

const modifiers = [
  "", "old", "wet", "dusty", "faded", "cheap", "warm", "cold", "dirty", "moldy",
  "broken", "sunburnt", "expired", "foggy", "stale", "cracked", "sticky", "greasy",
  "washed", "soggy", "crispy", "frozen", "salty", "glossy", "smoky", "dented",
  "crusty", "oily", "musty", "dry", "bleached", "muddy", "vintage", "rotting"
];
let prompts = [];
baseObjects.forEach(obj=>{
  modifiers.forEach(mod=>{
    let words = obj.n.split(" ");
    let text = mod ? mod + " " + obj.n : obj.n;
    if(text.split(" ").length <= 3){
      prompts.push({text:text, color:obj.c, code:obj.h});
    }
  });
});
prompts = prompts.slice(0,1000);
let used = [];
let current = prompts[0];
function generatePrompt(){
  if(used.length >= prompts.length) used = [];
  let pick;
  do{
    pick = Math.floor(Math.random() * prompts.length);
  }while(used.includes(pick));
  used.push(pick);
  current = prompts[pick];
  document.getElementById("prompt").innerText = current.text;
  document.getElementById("answerBox").style.display = "none";
  document.getElementById("counter").innerText =
    used.length + " / " + prompts.length + " used";
}
function showAnswer(){
  document.getElementById("answerBox").style.display = "block";
  document.getElementById("colorPreview").style.background = current.color;
  document.getElementById("boardCode").innerText = current.code;
  document.getElementById("hexCode").innerText = current.color;
}
generatePrompt();
