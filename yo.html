<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hues & Cues Chaos</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:800px;
    text-align:center;
    background:#1b1b1b;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
    margin-top:0;
    font-size:2.5rem;
}

.prompt{
    font-size:2rem;
    margin:40px 0;
    min-height:100px;
    line-height:1.4;
}

button{
    background:#fff;
    color:#000;
    border:none;
    padding:15px 25px;
    margin:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:1rem;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.answerBox{
    margin-top:30px;
    display:none;
}

.colorPreview{
    width:220px;
    height:220px;
    border-radius:16px;
    margin:20px auto;
    border:5px solid white;
}

.code{
    font-size:3rem;
    font-weight:bold;
    margin-top:10px;
}

.hex{
    opacity:0.8;
    margin-top:10px;
    font-size:1.1rem;
}

.small{
    opacity:0.6;
    font-size:0.9rem;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎨 Hues & Cues Chaos</h1>

<div class="prompt" id="prompt">
Press Generate Prompt
</div>

<button onclick="generatePrompt()">Generate Prompt</button>
<button onclick="showAnswer()">Show Answer</button>

<div class="answerBox" id="answerBox">

<div class="colorPreview" id="colorPreview"></div>

<div class="code" id="boardCode"></div>

<div class="hex" id="hexCode"></div>

<div class="small">
Closest Hues & Cues board match
</div>

</div>

</div>

<script>

const prompts = [

{

hue:45,
sat:15,
light:78
},

{

hue:85,
sat:45,

},

{

light:48
},

{
text:"pool noodle after summer",

light:60
},

{
text:"hospital blanket under fluorescent lights",
hue:195,
sat:18,
light:72
},

{
text:"dirty snow cone",
hue:315,
sat:55,
light:58
},

{
text:"airport carpet from 2003",
hue:240,
sat:35,
light:30
},

{
text:"sun faded walmart sign",
hue:210,
sat:55,
light:68
},

{
text:"old tennis ball after rain",
hue:72,
sat:58,
light:52
},

{
text:"melted popsicle on concrete",
hue:345,
sat:82,
light:61
},

{
text:"cheap motel wall paint",
hue:32,
sat:22,
light:70
},

{
text:"wet cardboard in florida humidity",
hue:30,
sat:30,
light:55
},

{
text:"boat dock rope after a storm",
hue:38,
sat:35,
light:40
},

{
text:"microwave pizza from a gas station",
hue:18,
sat:78,
light:48
},

{

hue:205,
sat:28,

},

},

{

hue:60,

},

{
text:"stale cheeto dust",
hue:34,
sat:90,
light:56
},

{
text:"garden hose water",
hue:192,
sat:40,
light:70
},

{
text:"rusty playground slide",
hue:14,
sat:65,
light:44
},

{
text:"burnt grilled cheese",
hue:24,

light:25
},

{

hue:285,
sat:35,
light:48
},

{
text:"sunburnt lawn chair",
hue:8,

light:64
},

{
text:"dusty chalk in a classroom",
hue:50,
sat:10,
light:88
},

{
text:"dirty aquarium rock",
hue:175,
sat:22,
light:42
}

];

let currentColor = "";
let currentCode = "";

function generatePrompt(){

    const selected =
        prompts[Math.floor(Math.random() * prompts.length)];

    document.getElementById("prompt").innerText =
        selected.text;

    document.getElementById("answerBox").style.display =
        "none";

    const snapped = snapToBoard(
        selected.hue,
        selected.sat,
        selected.light
    );

    currentColor = snapped.color;
    currentCode = snapped.code;
}

function snapToBoard(h,s,l){

    const cols = 30;
    const rows = 16;

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const col =
        Math.floor((h / 360) * cols);

    const row =
        Math.floor(((l - 20) / 70) * rows);

    const safeCol =
        Math.max(0, Math.min(cols - 1, col));

    const safeRow =
        Math.max(0, Math.min(rows - 1, row));

    const snappedHue =
        (safeCol / cols) * 360;

    const snappedLight =
        20 + (safeRow / rows) * 70;

    const color =
        `hsl(${snappedHue}, ${s}%, ${snappedLight}%)`;

    const code =
        `${letters[Math.floor(safeCol / 2)]}${safeRow + 1}`;

    return {
        color,
        code
    };
}

function showAnswer(){

    document.getElementById("answerBox").style.display =
        "block";

    document.getElementById("colorPreview").style.background =
        currentColor;

    document.getElementById("boardCode").innerText =
        currentCode;

    document.getElementById("hexCode").innerText =
        currentColor;
}

generatePrompt();

</script>

</body>
</html>
