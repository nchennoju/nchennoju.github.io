<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hues & Cues Chaos Generator</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:800px;
    text-align:center;
    background:#1b1b1b;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
    margin-top:0;
    font-size:2.5rem;
}

.prompt{
    font-size:2rem;
    margin:40px 0;
    min-height:100px;
}

button{
    background:#fff;
    color:#000;
    border:none;
    padding:15px 25px;
    margin:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:1rem;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.answerBox{
    margin-top:30px;
    display:none;
}

.colorPreview{
    width:180px;
    height:180px;
    border-radius:16px;
    margin:20px auto;
    border:4px solid white;
}

.code{
    font-size:2rem;
    font-weight:bold;
}

.hex{
    opacity:0.8;
    margin-top:10px;
}

.small{
    opacity:0.6;
    font-size:0.9rem;
}
</style>
</head>

<body>

<div class="container">

<h1>🎨 Hues & Cues Chaos</h1>

<div class="prompt" id="prompt">
Press Generate
</div>

<button onclick="generatePrompt()">Generate Prompt</button>
<button onclick="showAnswer()">Show Answer</button>

<div class="answerBox" id="answerBox">

<div class="colorPreview" id="colorPreview"></div>

<div class="code" id="boardCode"></div>

<div class="hex" id="hexCode"></div>

<div class="small">
Closest board color match
</div>

</div>

</div>

<script>

const nouns = [
"gas station hot dog",
"wet cardboard",
"expired guacamole",
"pool noodle",
"old banana peel",
"hospital blanket",
"airport carpet",
"tennis ball",
"sunburnt lawn chair",
"cheap motel wall",
"grandma candy wrapper",
"dirty snow cone",
"faded walmart sign",
"parking garage puddle",
"old ketchup packet",
"ipad kid cough syrup",
"burnt grilled cheese",
"microwave pizza",
"old bruise",
"rusty playground slide",
"old croc shoe",
"stale cheeto",
"boat dock rope",
"pool water",
"truck stop bathroom tile",
"sun faded beach toy",
"dusty chalk",
"old newspaper",
"foggy windshield",
"garden hose water",
"cheap sunscreen",
"old traffic cone",
"melted popsicle",
"cracked iphone case",
"old bandaid",
"moldy bread corner",
"dirty aquarium rock",
"warm sprite",
"old tennis court",
"broken flip flop"
];

const variants = [
"left in the sun",
"at 2 AM",
"after rain",
"under fluorescent lights",
"in Florida humidity",
"behind a gas station",
"covered in dust",
"freshly cleaned",
"after being microwaved",
"after a road trip",
"from 2007",
"after sitting outside",
"in a school cafeteria",
"under LED lights",
"during summer",
"in a motel room",
"at the beach",
"from a thrift store",
"after being dropped",
"after 10 years"
];

let currentColor = "#ffffff";
let currentCode = "A1";

function generatePrompt(){

    const noun = nouns[Math.floor(Math.random()*nouns.length)];
    const variant = variants[Math.floor(Math.random()*variants.length)];

    document.getElementById("prompt").innerText =
        `${noun} ${variant}`;

    document.getElementById("answerBox").style.display = "none";

    generateMatchingColor();
}

function generateMatchingColor(){

    const cols = 30;
    const rows = 16;

    const colLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const x = Math.floor(Math.random()*cols);
    const y = Math.floor(Math.random()*rows);

    const hue = (x / cols) * 360;
    const light = 25 + (y / rows) * 50;

    currentColor = `hsl(${hue}, 70%, ${light}%)`;

    currentCode = `${colLetters[Math.floor(x/2)]}${y+1}`;
}

function showAnswer(){

    document.getElementById("answerBox").style.display = "block";

    document.getElementById("colorPreview").style.background =
        currentColor;

    document.getElementById("boardCode").innerText =
        currentCode;

    document.getElementById("hexCode").innerText =
        currentColor;
}

</script>

</body>
</html>
