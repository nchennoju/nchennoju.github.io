<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hues & Cues Chaos Generator</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#111;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .container{
        max-width:700px;
        width:100%;
        background:#1b1b1b;
        border-radius:20px;
        padding:30px;
        box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
        text-align:center;
        margin-top:0;
    }

    .descriptor{
        font-size:2rem;
        text-align:center;
        margin:40px 0;
        min-height:120px;
    }

    .buttons{
        display:flex;
        gap:15px;
        justify-content:center;
        flex-wrap:wrap;
    }

    button{
        padding:15px 25px;
        border:none;
        border-radius:12px;
        font-size:1rem;
        cursor:pointer;
        background:#2f2f2f;
        color:white;
        transition:0.2s;
    }

    button:hover{
        background:#444;
        transform:scale(1.03);
    }

    .answer{
        margin-top:40px;
        text-align:center;
        display:none;
    }

    .color-box{
        width:180px;
        height:180px;
        border-radius:18px;
        margin:20px auto;
        border:4px solid white;
    }

    .code{
        font-size:1.3rem;
        margin-top:10px;
    }

    .coord{
        font-size:1.1rem;
        opacity:0.8;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Hues & Cues Chaos</h1>

    <div class="descriptor" id="descriptor">
        Press Generate
    </div>

    <div class="buttons">
        <button onclick="generatePrompt()">Generate Prompt</button>
        <button onclick="showAnswer()">Show Answer</button>
    </div>

    <div class="answer" id="answer">
        <div class="color-box" id="colorBox"></div>
        <div class="code" id="hexCode"></div>
        <div class="coord" id="coord"></div>
    </div>

</div>

<script>

const adjectives = [
"wet",
"sun-faded",
"expired",
"moldy",
"cheap",
"frozen",
"dusty",
"sticky",
"microwaved",
"crusty",
"greasy",
"burnt",
"half-eaten",
"neon",
"radioactive-looking",
"Florida",
"humid",
"cursed",
"shiny",
"depressing"
];

const objects = [
"pool noodle",
"gas station hot dog",
"airport carpet",
"banana peel",
"tennis ball",
"hospital blanket",
"pool water",
"pickle",
"parking garage wall",
"playground slide",
"old ketchup packet",
"expired guacamole",
"traffic cone",
"laundry basket",
"plastic lawn chair",
"rubber duck",
"gummy bear",
"school cafeteria pizza",
"beach towel",
"sunscreen bottle",
"boat seat",
"drywall",
"garden hose",
"soda can",
"cheap flip-flops",
"toilet cleaner",
"pickle juice",
"dusty keyboard",
"marker cap",
"used sponge",
"monster energy can",
"motel bedspread",
"pickleball paddle",
"rusty grill",
"chlorine bucket",
"frog",
"old iPhone case",
"pool float",
"Dollar Tree candle",
"birthday balloon",
"bouncy ball",
"traffic light",
"melted popsicle",
"gas pump handle",
"old Croc",
"sunburnt tourist",
"bar soap",
"mall tile",
"spray tan",
"water gun",
"chalk",
"rusty bike",
"orange extension cord",
"wet cardboard",
"cheeto dust",
"old bandaid",
"cough syrup",
"fluorescent highlighter",
"used napkin",
"fishing lure",
"baby food",
"popsicle stick",
"recycled plastic bin",
"old yoga mat",
"pickle bucket",
"garden mulch",
"fake plant",
"mystery meat",
"shower curtain",
"public pool tile",
"crayon",
"sweaty t-shirt",
"energy drink",
"school bus seat",
"old notebook",
"cat puke",
"microwave ramen",
"rain puddle",
"margarita mix",
"old traffic sign",
"golf ball",
"mustard packet",
"mop water",
"faded Lego brick",
"stale marshmallow",
"old pumpkin",
"sun-bleached umbrella",
"foam dart",
"beach cooler",
"used tennis shoe",
"pickle jar lid",
"old Taco Bell wrapper",
"fake cheese",
"sour candy",
"slime toy",
"construction vest",
"barbecue sauce stain",
"pool chlorine test strip",
"soggy cereal",
"leaf blower",
"arcade carpet",
"mall pretzel"
];

let currentColor = "#ffffff";
let currentCoord = "A1";

function randomItem(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function randomHex(){
    const letters = "0123456789ABCDEF";
    let color = "#";
    for(let i=0;i<6;i++){
        color += letters[Math.floor(Math.random()*16)];
    }
    return color;
}

function randomCoord(){
    const letters = "ABCDEFGH";
    const letter = letters[Math.floor(Math.random()*letters.length)];
    const number = Math.floor(Math.random()*30)+1;
    return letter + number;
}

function generatePrompt(){

    const descriptor =
        randomItem(adjectives) + " " + randomItem(objects);

    document.getElementById("descriptor").innerText = descriptor;

    currentColor = randomHex();
    currentCoord = randomCoord();

    document.getElementById("answer").style.display = "none";
}

function showAnswer(){

    document.getElementById("answer").style.display = "block";

    document.getElementById("colorBox").style.background =
        currentColor;

    document.getElementById("hexCode").innerText =
        currentColor;

    document.getElementById("coord").innerText =
        "Hues & Cues Coordinate: " + currentCoord;
}

</script>

</body>
</html>
